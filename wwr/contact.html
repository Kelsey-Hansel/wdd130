<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,inital-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="How to contact us.">
    <meta name="author" content="Kelsey Hansel">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grenze:wght@200;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="contact">
            <h1>Company Information</h1>
            <p>Phone Number: 123-456-7890</p>
            <p>Address: 123 St Address, Wichita, KS 12345</p>
            <p>Email: example@email.com</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1578.696972915982!2d-97.34432902067621!3d37.6869462513727!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1754163103027!5m2!1sen!2sus" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <section class="employees">
            <h1>Meet Some of Our Employees</h1>
            <figure>
                <img src="images/happy-employee-one.jpg" alt="A happy employee.">
                <figcaption>Trip Planning Director</figcaption>
            </figure>
            <figure>
                <img src="images/happy-employee-two.jpg" alt="A happy employee.">
                <figcaption>Head Rafting Guide</figcaption>
            </figure>
            <figure>
                <img src="images/happy-employee-three.jpg" alt="A happy employee.">
                <figcaption>Lead Photographer</figcaption>
            </figure>
        </section>
        <section class="form-items">
            <h1>Get In Touch</h1>
            <form>
                <fieldset class="usercontact">
                    <legend>Your Contact</legend>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail">
                </fieldset>
                <fieldset class="userselect">
                    <legend>Purpose:</legend>
                    <label for="general inquiry">General Inquiry</label>
                    <input type="radio" id="general inquiry" name="general inquiry">
                    <label for="reservation question">Reservation Question</label>
                    <input type="radio" id="reservation question" name="reservation question">
                    <label for="website suggestion">Website Suggestion</label>
                    <input type="radio" id="website suggestion" name="website suggestion">
                    </fieldset>
                    <fieldset class="usercomment">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
                        <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                        <input type="checkbox" id="newsletter" name="newsletter">
                </fieldset>
                <button type="submit">Submit</button>
            </form>    
        </section>
    </main>
    <footer>
        <p>&copy;2025 Happy Rafting Co.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="logo for Facebook with link">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="logo for Instagram with link">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.png" alt="logo for YouTube with link">
            </a>
        </nav>
        <a href="https://app.moqups.com/xxIMqGrrQ5shuMYaT6HNNMdba7v3ctCI/view/page/ad64222d5">Wireframe</a>
    </footer>
</body>

</html>
